<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin — Doações</title>
<style>body{font:15px system-ui,sans-serif;background:#0d0d10;color:#eee;margin:0 auto;padding:14px;max-width:560px}input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #333;background:#1b1b21;color:#eee;width:100%;box-sizing:border-box;margin:4px 0}button{cursor:pointer;background:#7c3aed;border:0;font-weight:700}.c{background:#17171c;border:1px solid #2a2a33;border-radius:10px;padding:10px;margin:8px 0}.r{display:flex;gap:6px}.r button{width:auto;flex:1}.no{background:#7f1d1d}.mut{color:#999;font-size:12px}label{display:flex;gap:8px;align-items:center;margin:6px 0}label input{width:auto}.h{display:flex;gap:10px;align-items:center}.h img{width:56px;height:56px;border-radius:50%;object-fit:cover}</style></head><body>
<h2>Doações — admin</h2>
<input id="sec" type="password" placeholder="ADMIN_SECRET (não fica salvo)" autocomplete="off">
<div class="r"><button id="bp">Aguardando Pix</button><button id="bc">Confirmadas</button><button id="bf">Fotos p/ aprovar</button></div>
<div id="list" class="mut">Digite o segredo e toque em um dos botões.</div>
<h3>Adicionar doação manual</h3>
<div class="mut">Pagamentos pelo Asaas são confirmados sozinhos. Use só se o webhook falhar ou para registrar uma doação feita fora do site.</div>
<input id="mn" placeholder="Nome ou apelido" maxlength="30"><input id="ma" type="number" step="0.01" placeholder="Valor (R$)"><input id="mm" placeholder="Mensagem (opcional)" maxlength="80">
<label><input id="ms" type="checkbox"> mostrar valor no mural</label>
<button id="madd">Adicionar já confirmada</button>
<script>
const API="https://cassino-backend-24ha.onrender.com";
const $=i=>document.getElementById(i);
let cur='pending';
async function call(path,method,body){
  const r=await fetch(API+path,{method:method||'GET',headers:{'Content-Type':'application/json','x-admin-secret':$('sec').value},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||('Erro '+r.status));
  return j;
}
async function act(id,a,body){try{await call('/api/admin/donations/'+id+'/'+a,'POST',body||{});load(cur)}catch(e){alert(e.message)}}
function btn(txt,cls,fn){const b=document.createElement('button');b.textContent=txt;if(cls)b.className=cls;b.onclick=fn;return b}
async function load(st){
  cur=st;const box=$('list');box.textContent='Carregando… (o servidor pode levar 1 min para acordar)';
  try{
    let items=await call('/api/admin/donations?status='+(st==='photos'?'confirmed':st));
    if(st==='photos')items=items.filter(d=>d.avatar&&!d.avatarOk);
    box.textContent='';
    if(!items.length){box.textContent='Nenhuma.';return}
    items.sort((a,b)=>((b.createdAt&&b.createdAt._seconds)||0)-((a.createdAt&&a.createdAt._seconds)||0));
    items.forEach(d=>{
      const c=document.createElement('div');c.className='c';
      const h=document.createElement('div');h.className='h';
      if(d.avatar){const im=document.createElement('img');im.src=d.avatar;im.alt='';h.append(im)}
      const tx=document.createElement('div');
      const t=document.createElement('div');t.textContent=d.displayName+' — R$ '+Number(d.amount).toFixed(2)+' ('+(d.code||'')+')';
      const m=document.createElement('div');m.className='mut';
      m.textContent=(d.message?d.message+' · ':'')+(d.showAmount?'valor visível':'valor oculto')+(d.avatar?(d.avatarOk?' · foto aprovada':' · foto aguardando aprovação'):'');
      tx.append(t,m);h.append(tx);c.append(h);
      const r=document.createElement('div');r.className='r';
      if(st==='pending'){r.append(btn('Confirmar','',()=>act(d.id,'confirm')),btn('Rejeitar','no',()=>act(d.id,'reject')))}
      if(d.avatar){if(!d.avatarOk)r.append(btn('Aprovar foto','',()=>act(d.id,'avatar',{approve:true})));r.append(btn('Remover foto','no',()=>act(d.id,'avatar',{approve:false})))}
      if(r.children.length)c.append(r);
      box.append(c);
    });
  }catch(e){box.textContent='Erro: '+e.message}
}
$('bp').onclick=()=>load('pending');$('bc').onclick=()=>load('confirmed');$('bf').onclick=()=>load('photos');
$('madd').onclick=async()=>{
  try{
    await call('/api/admin/donations/manual','POST',{displayName:$('mn').value,amount:$('ma').value,message:$('mm').value,showAmount:$('ms').checked});
    $('mn').value=$('ma').value=$('mm').value='';alert('Adicionada!');
  }catch(e){alert(e.message)}
};
</script></body></html>
