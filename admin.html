<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin — Doações</title>
<style>body{font:15px system-ui,sans-serif;background:#0d0d10;color:#eee;margin:0 auto;padding:14px;max-width:560px}input,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #333;background:#1b1b21;color:#eee;width:100%;box-sizing:border-box;margin:4px 0}button{cursor:pointer;background:#7c3aed;border:0;font-weight:700}.c{background:#17171c;border:1px solid #2a2a33;border-radius:10px;padding:10px;margin:8px 0}.r{display:flex;gap:6px}.r button{width:auto;flex:1}.no{background:#7f1d1d}.mut{color:#999;font-size:12px}label{display:flex;gap:8px;align-items:center;margin:6px 0}label input{width:auto}</style></head><body>
<h2>Doações — admin</h2>
<input id="sec" type="password" placeholder="ADMIN_SECRET (não fica salvo)" autocomplete="off">
<div class="r"><button id="bp">Pendentes</button><button id="bc">Confirmadas</button></div>
<div id="list" class="mut">Digite o segredo e toque em Pendentes.</div>
<h3>Adicionar doação manual</h3>
<input id="mn" placeholder="Nome ou apelido" maxlength="30"><input id="ma" type="number" step="0.01" placeholder="Valor (R$)"><input id="mm" placeholder="Mensagem (opcional)" maxlength="80">
<label><input id="ms" type="checkbox"> mostrar valor no mural</label>
<button id="madd">Adicionar já confirmada</button>
<script>
const API="https://cassino-backend-b1ck.onrender.com";
const $=i=>document.getElementById(i);
async function call(path,method,body){
  const r=await fetch(API+path,{method:method||'GET',headers:{'Content-Type':'application/json','x-admin-secret':$('sec').value},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||('Erro '+r.status));
  return j;
}
async function act(id,a){try{await call('/api/admin/donations/'+id+'/'+a,'POST',{});load('pending')}catch(e){alert(e.message)}}
async function load(st){
  const box=$('list');box.textContent='Carregando… (o servidor pode levar 1 min para acordar)';
  try{
    const items=await call('/api/admin/donations?status='+st);
    box.textContent='';
    if(!items.length){box.textContent='Nenhuma.';return}
    items.sort((a,b)=>((b.createdAt&&b.createdAt._seconds)||0)-((a.createdAt&&a.createdAt._seconds)||0));
    items.forEach(d=>{
      const c=document.createElement('div');c.className='c';
      const t=document.createElement('div');t.textContent=d.displayName+' — R$ '+Number(d.amount).toFixed(2)+' ('+(d.code||'')+')';
      const m=document.createElement('div');m.className='mut';m.textContent=(d.message?d.message+' · ':'')+(d.showAmount?'valor visível':'valor oculto');
      c.append(t,m);
      if(st==='pending'){
        const r=document.createElement('div');r.className='r';
        const ok=document.createElement('button');ok.textContent='Confirmar';ok.onclick=()=>act(d.id,'confirm');
        const no=document.createElement('button');no.className='no';no.textContent='Rejeitar';no.onclick=()=>act(d.id,'reject');
        r.append(ok,no);c.append(r);
      }
      box.append(c);
    });
  }catch(e){box.textContent='Erro: '+e.message}
}
$('bp').onclick=()=>load('pending');$('bc').onclick=()=>load('confirmed');
$('madd').onclick=async()=>{
  try{
    await call('/api/admin/donations/manual','POST',{displayName:$('mn').value,amount:$('ma').value,message:$('mm').value,showAmount:$('ms').checked});
    $('mn').value=$('ma').value=$('mm').value='';alert('Adicionada!');
  }catch(e){alert(e.message)}
};
</script></body></html>
