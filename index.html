            <div style={{display:"flex",gap:6,marginBottom:16,background:"rgba(255,255,255,.02)",borderRadius:14,padding:4,border:"1px solid rgba(255,255,255,.05)"}}>
              {['offline','online'].map(m=>(
                <button key={m} onClick={()=>setGameMode(m)} style={{flex:1,padding:"9px",background:gameMode===m?m==='online'?"linear-gradient(135deg,rgba(46,204,113,.15),rgba(46,204,113,.05))":"linear-gradient(135deg,rgba(241,196,15,.12),rgba(241,196,15,.04))":"transparent",border:`1px solid ${gameMode===m?m==='online'?"rgba(46,204,113,.4)":"rgba(241,196,15,.3)":"transparent"}`,borderRadius:10,color:gameMode===m?m==='online'?"#2ecc71":"#f1c40f":"#444",cursor:"pointer",fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:12,letterSpacing:2,transition:"all .25s"}}>
                  {m==='offline'?"🎮 OFFLINE":"⚡ ONLINE"}
                </button>
              ))}
              <div style={{textAlign:"center",marginTop:6,color:"rgba(255,255,255,.2)",fontSize:9,fontFamily:"'Rajdhani',sans-serif",letterSpacing:1}}>
                ✓ Mesmo saldo nos dois modos
              </div>
            </div>

            {/* Título jogos */}
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
              <div style={{flex:1,height:1,background:"linear-gradient(90deg,transparent,rgba(241,196,15,.2))"}}/>
              <span style={{color:"rgba(241,196,15,.4)",fontSize:9,letterSpacing:4,fontFamily:"'Rajdhani',sans-serif",fontWeight:700}}>JOGOS</span>
              <div style={{flex:1,height:1,background:"linear-gradient(90deg,rgba(241,196,15,.2),transparent)"}}/>
            </div>

            {/* Grid de jogos */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
              {[
                {k:"dados",i:"🎲",n:"Dados",d:"Alto · Baixo · Exato",c:"#c0392b",gc:"#2a0808"},
                {k:"lobby",i:"🌐",n:"Online",d:"vs Jogadores Reais",c:"#2ecc71",gc:"#082a15"},
                {k:"pife",i:"🃏",n:"Pife",d:"1 ou 2 baralhos",c:"#2471a3",gc:"#060f1a"},
                {k:"domino",i:"🁣",n:"Dominó",d:"2 a 4 jogadores",c:"#d4ac0d",gc:"#1a1400"},
                {k:"truco",i:"⚡",n:"Truco",d:"Em breve",c:"#ca6f1e",gc:"#1a0e05",disabled:true},
                {k:"poker",i:"♦",n:"Poker",d:"Em breve",c:"#8e44ad",gc:"#12071a",disabled:true},
              ].map(g=>(
                <div key={g.k} onClick={()=>!g.disabled&&setScreen(g.k)}
                  style={{background:`linear-gradient(145deg,${g.gc} 0%,#050505 100%)`,border:`1px solid ${g.disabled?"rgba(255,255,255,.05)":`${g.c}25`}`,borderRadius:16,padding:"16px 14px",cursor:g.disabled?"not-allowed":"pointer",opacity:g.disabled?.4:1,transition:"all .25s",position:"relative",overflow:"hidden"}}
                  onMouseEnter={e=>{if(!g.disabled){e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.borderColor=`${g.c}55`;e.currentTarget.style.boxShadow=`0 8px 24px ${g.c}15`;}}}
                  onMouseLeave={e=>{e.currentTarget.style.transform="none";e.currentTarget.style.borderColor=g.disabled?"rgba(255,255,255,.05)":`${g.c}25`;e.currentTarget.style.boxShadow="none";}}>
                  {!g.disabled&&<div style={{position:"absolute",top:0,right:0,width:60,height:60,background:`radial-gradient(circle at top right,${g.c}12,transparent 70%)`}}/>}
                  <div style={{fontSize:28,marginBottom:8}}>{g.i}</div>
                  <div style={{fontWeight:700,fontSize:14,color:"#fff"}}>{g.n}</div>
                  <div style={{color:"#666",fontSize:11,marginTop:2}}>{g.d}</div>
                </div>
              ))}
            </div>

            {/* Sobre / Créditos */}
            <div onClick={()=>setShowAbout(true)} style={{background:"rgba(255,255,255,.02)",border:"1px solid rgba(255,255,255,.05)",borderRadius:12,padding:"12px 16px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}
              onMouseEnter={e=>e.currentTarget.style.background="rgba(255,255,255,.05)"}
              onMouseLeave={e=>e.currentTarget.style.background="rgba(255,255,255,.02)"}>
              <div>
                <div style={{color:"#aaa",fontSize:13,fontWeight:700}}>ℹ️ Sobre & Créditos</div>
                <div style={{color:"#555",fontSize:10}}>ar.softworks.suport@gmail.com</div>
              </div>
              <div style={{color:"#555"}}>›</div>
            </div>

            <div style={{textAlign:"center",color:"#2a2a2a",fontSize:9,marginTop:8}}>
              Dev: AR Softworks™ & AR Softworks™ • 🔞 +18
            </div>
          </div>
        )}
        {GAMES[screen]}
      </div>

      {/* Bottom Nav */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,zIndex:200,background:"rgba(4,4,4,.98)",backdropFilter:"blur(20px)",borderTop:"1px solid rgba(241,196,15,.18)",display:"flex",minHeight:60,paddingBottom:"env(safe-area-inset-bottom)"}}>
        {nav.map(item=>(
          <button key={item.k} onClick={()=>{if(item.k==='shop_btn'){setShowShop(true);return;}if(item.k==='lobby')setGameMode('online');setScreen(item.k);}} style={{flex:1,minWidth:44,background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:2,color:screen===item.k?"#f1c40f":"#3a3a3a",borderTop:screen===item.k?"2px solid #f1c40f":"2px solid transparent",transition:"all .2s",fontSize:8,fontWeight:700,padding:"8px 0"}}>
            <span style={{fontSize:16}}>{item.i}</span>{item.l}
          </button>
        ))}
      </div>

      {/* Modais */}
      {showShop&&<ShopScreen user={authUser} userData={userData} token={token} chips={chips} onClose={()=>setShowShop(false)}/>}
      {showAdModal&&(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.92)",zIndex:9999,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#111",border:"2px solid #f1c40f",borderRadius:16,padding:28,maxWidth:340,width:"100%",textAlign:"center"}}>
        {!adWatching?<>
          <div style={{fontSize:44,marginBottom:8}}>📺</div>
          <div style={{color:"#f1c40f",fontSize:18,fontWeight:900,fontFamily:"'Cinzel',Georgia,serif",marginBottom:4,letterSpacing:1}}>GANHE 1 FICHA</div>
          <div style={{color:"rgba(255,255,255,.4)",fontSize:11,marginBottom:14,fontFamily:"'Rajdhani',sans-serif"}}>grátis assistindo um anúncio</div>
          <div style={{background:"rgba(46,204,113,.08)",border:"1px solid rgba(46,204,113,.2)",borderRadius:12,padding:"12px",marginBottom:14}}>
            <div style={{color:"#2ecc71",fontSize:30,fontWeight:900,fontFamily:"'Cinzel',Georgia,serif"}}>+1 🎰</div>
            <div style={{color:"rgba(255,255,255,.35)",fontSize:10,marginTop:2,fontFamily:"'Rajdhani',sans-serif",letterSpacing:1}}>CREDITADO AUTOMATICAMENTE</div>
          </div>
          <div style={{color:"rgba(255,255,255,.3)",fontSize:11,marginBottom:14,lineHeight:1.6,textAlign:"left",background:"rgba(255,255,255,.03)",borderRadius:8,padding:"10px 12px"}}>
            1️⃣ Clique no botão abaixo<br/>
            2️⃣ Assista o anúncio até o final<br/>
            3️⃣ Receba <strong style={{color:"#2ecc71"}}>+1 ficha</strong> automaticamente!
          </div>
          <button onClick={watchAd} style={{width:"100%",padding:"16px",background:"linear-gradient(135deg,#d4ac0d,#a07d08)",border:"none",borderRadius:12,color:"#000",fontSize:15,fontWeight:900,cursor:"pointer",fontFamily:"'Cinzel',Georgia,serif",marginBottom:10,boxShadow:"0 4px 20px rgba(212,172,13,.4)",letterSpacing:1}}>
            📺 ASSISTIR E GANHAR +1 FICHA
          </button>
          <button onClick={()=>setShowAdModal(false)} style={{width:"100%",padding:"10px",background:"transparent",border:"1px solid rgba(255,255,255,.08)",borderRadius:10,color:"#444",fontSize:12,cursor:"pointer",fontFamily:"'Rajdhani',sans-serif",letterSpacing:1}}>
            AGORA NÃO
          </button>
        </>:<>
          <div style={{fontSize:48,marginBottom:12}}>📺</div>
          <div style={{color:"#f1c40f",fontSize:16,fontWeight:700,marginBottom:16}}>Assistindo anúncio...</div>
          <div style={{width:80,height:80,borderRadius:"50%",background:"rgba(241,196,15,.1)",border:"4px solid #f1c40f",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px",fontSize:28,fontWeight:900,color:"#f1c40f"}}>
            {adTimer}
          </div>
          <div style={{color:"#555",fontSize:12}}>Não feche esta tela!</div>
          <div style={{height:4,background:"rgba(255,255,255,.05)",borderRadius:2,marginTop:16,overflow:"hidden"}}>
            <div style={{height:"100%",background:"#f1c40f",borderRadius:2,width:`${((30-adTimer)/30)*100}%`,transition:"width 1s linear"}}/>
          </div>
        </>}
      </div>
    </div>
  )}
  {showProfile&&<ProfileScreen user={authUser} userData={userData} onSave={d=>setUserData(u=>({...u,...d}))} onClose={()=>setShowProfile(false)}/>}
      {showAbout&&<AboutScreen onClose={()=>setShowAbout(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});
}
</script>
</body>
</html>
