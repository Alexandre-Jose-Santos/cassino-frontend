}


function Go({chips,onChange,log,mode}){
  const COST=mode==='online'?5:1;
  var N=19;
  var KOMI=6.5;

  function emptyBoard(){return Array.from({length:N},function(){return new Array(N).fill(null);});}
  function copyBoard(b){return b.map(function(r){return r.slice();});}

  var [board,setBoard]=useState(emptyBoard());
  var [prevBoard,setPrevBoard]=useState(null);
  var [turn,setTurn]=useState('B');
  var [phase,setPhase]=useState('idle'); // idle | config | play | scoring | over
  var [passCount,setPassCount]=useState(0);
  var [caps,setCaps]=useState({B:0,W:0});
  var [msg,setMsg]=useState('');
  var [result,setResult]=useState(null);
  var [bet,setBet]=useState(10);
  var [countMethod,setCountMethod]=useState('territory');
  var [komi,setKomi]=useState(6.5);
  var [thinking,setThinking]=useState(false);
  var [lastMove,setLastMove]=useState(null);
  var [deadStones,setDeadStones]=useState([]); // marked during scoring
  var [scorePreview,setScorePreview]=useState(null);
  var [hoverCell,setHoverCell]=useState(null);
  var [scroll,setScroll]=useState({x:0,y:0});
  var [zoom,setZoom]=useState(1);
  var CELL=28*zoom;

  var STAR_POINTS=[[3,3],[3,9],[3,15],[9,3],[9,9],[9,15],[15,3],[15,9],[15,15]];

  function startGame(){
    if(chips<COST)return;
    onChange(-COST);
    setBoard(emptyBoard());
    setPrevBoard(null);
    setTurn('B');
    setPhase('play');
    setPassCount(0);
    setCaps({B:0,W:0});
    setMsg('Pretas jogam primeiro');
    setResult(null);
    setLastMove(null);
    setDeadStones([]);
  }

  function placeStone(r,c){
    if(phase!=='play'||turn!=='B'||thinking)return;
    if(!goLegal(board,r,c,'B',prevBoard,N)){setMsg('Movimento ilegal!');return;}
    var nb=copyBoard(board);
    nb[r][c]='B';
    var captured=goCapture(nb,r,c,N);
    setPrevBoard(copyBoard(board));
    setBoard(nb);
    setLastMove([r,c]);
    setCaps(function(cp){return{B:cp.B+captured.length,W:cp.W};});
    setPassCount(0);
    setMsg('Brancas pensando...');
    setTurn('W');
    // AI move
    setThinking(true);
    var boardSnap=copyBoard(nb);
    var prevSnap=copyBoard(board);
    setTimeout(function(){
      var aiMove=goAI(boardSnap,'W',N,{B:caps.B,W:caps.W+captured.length});
      if(!aiMove){
        // AI passes
        setPassCount(function(p){
          if(p+1>=2){enterScoring(boardSnap);return p+1;}
          return p+1;
        });
        setMsg('Brancas passaram. Sua vez (Pretas)');
        setTurn('B');
        setThinking(false);
        return;
      }
      var nb2=copyBoard(boardSnap);
      nb2[aiMove[0]][aiMove[1]]='W';
      var cap2=goCapture(nb2,aiMove[0],aiMove[1],N);
      setPrevBoard(boardSnap);
      setBoard(nb2);
      setLastMove([aiMove[0],aiMove[1]]);
      setCaps(function(cp){return{B:cp.B,W:cp.W+cap2.length};});
      setPassCount(0);
      setMsg('Sua vez (Pretas)');
      setTurn('B');
      setThinking(false);
    },600+Math.random()*400);
  }

  function pass(){
    if(phase!=='play'||turn!=='B'||thinking)return;
    var newPass=passCount+1;
    if(newPass>=2){enterScoring(board);return;}
    setPassCount(newPass);
    setMsg('Você passou. Brancas pensando...');
    setTurn('W');
    setThinking(true);
    var boardSnap=copyBoard(board);
    setTimeout(function(){
      // AI also passes sometimes, or plays
      var aiMove=goAI(boardSnap,'W',N,caps);
      if(!aiMove||Math.random()<0.15){
        setPassCount(function(p){
          if(p+1>=2){enterScoring(boardSnap);return p+1;}
          return p+1;
        });
        setMsg('Brancas passaram. Fase de pontuação!');
        setTurn('B');
      } else {
        var nb2=copyBoard(boardSnap);
        nb2[aiMove[0]][aiMove[1]]='W';
        var cap2=goCapture(nb2,aiMove[0],aiMove[1],N);
        setPrevBoard(boardSnap);
        setBoard(nb2);
        setLastMove([aiMove[0],aiMove[1]]);
        setCaps(function(cp){return{B:cp.B,W:cp.W+cap2.length};});
        setPassCount(0);
        setMsg('Brancas jogaram. Sua vez (Pretas)');
        setTurn('B');
      }
      setThinking(false);
    },600+Math.random()*400);
  }

  function enterScoring(b){
    setPhase('scoring');
    setMsg('Marque as pedras mortas e confirme a pontuação');
    var sc=goScore(b,N,komi,countMethod);
    setScorePreview(sc);
  }

  function toggleDead(r,c){
    if(phase!=='scoring')return;
    if(!board[r][c])return;
    var key=r+','+c;
    var g=goGroup(board,r,c,N);
    var keys=g.stones.map(function(s){return s[0]+','+s[1];});
    setDeadStones(function(ds){
      var set=new Set(ds);
      var allDead=keys.every(function(k){return set.has(k);});
      if(allDead)keys.forEach(function(k){set.delete(k);});
      else keys.forEach(function(k){set.add(k);});
      return Array.from(set);
    });
  }

  function confirmScore(){
    // Remove dead stones and rescore
    var b=copyBoard(board);
    var deadSet=new Set(deadStones);
    var extraCaps={B:0,W:0};
    for(var i=0;i<N;i++)for(var j=0;j<N;j++){
      var k=i+','+j;
      if(deadSet.has(k)){
        if(b[i][j]==='B')extraCaps.W++;
        else if(b[i][j]==='W')extraCaps.B++;
        b[i][j]=null;
      }
    }
    var sc=goScore(b,N,komi,countMethod);
    var won=sc.black>sc.white;
    var diff=Math.abs(sc.black-sc.white);
    /* sem aposta */
    setResult({black:sc.black,white:sc.white,won:won,diff:diff,caps:extraCaps});
    setBoard(b);
    setPhase('over');
    log('Go: '+(won?'Vitória':'Derrota')+' — Pretas '+sc.black+' Brancas '+sc.white);
  }

  function resign(){
    setPhase('over');
    setResult({black:0,white:0,won:false,resigned:true});
    log('Go: Resignou');
  }

  var cellSize=CELL;
  var boardPx=cellSize*(N-1)+cellSize*2; // padding

  if(phase==='idle'||phase==='config'){
    return(
      <div style={{padding:'16px 10px',maxWidth:460,margin:'0 auto'}}>
        <div style={{textAlign:'center',padding:'28px 20px 24px',
          background:'radial-gradient(ellipse at 50% 0%,rgba(139,90,43,.3),rgba(5,5,5,.97))',
          border:'1px solid rgba(139,90,43,.3)',borderRadius:24,
          boxShadow:'0 20px 60px rgba(0,0,0,.7)'}}>
          <div style={{fontSize:48,marginBottom:8}}>⚫</div>
          <div style={{color:'#f1c40f',fontWeight:900,fontSize:24,fontFamily:"'Cinzel',serif",letterSpacing:3,marginBottom:4}}>GO</div>
          <div style={{color:'#555',fontSize:10,fontFamily:"'Rajdhani',sans-serif",letterSpacing:3,marginBottom:20}}>19x19 — OFFLINE VS IA</div>

          {/* Custo da partida */}
          <div style={{background:'rgba(241,196,15,.06)',border:'1px solid rgba(241,196,15,.2)',borderRadius:12,padding:'12px 14px',marginBottom:14}}>
            <div style={{color:'rgba(255,255,255,.4)',fontSize:10,letterSpacing:2,fontFamily:"'Rajdhani',sans-serif",marginBottom:2}}>{mode==='online'?'MODO ONLINE':'MODO OFFLINE'}</div>
            <div style={{color:'#f1c40f',fontSize:26,fontWeight:900,fontFamily:"'Cinzel',serif"}}>{COST} 🎰</div>
            <div style={{color:'rgba(255,255,255,.35)',fontSize:10,fontFamily:"'Rajdhani',sans-serif",letterSpacing:1}}>FICHA{COST>1?'S':''} POR PARTIDA</div>
          </div>

          <div style={{background:'rgba(0,0,0,.35)',borderRadius:14,padding:'14px',marginBottom:12,border:'1px solid rgba(255,255,255,.04)'}}>
            <div style={{color:'#555',fontSize:9,fontFamily:"'Rajdhani',sans-serif",letterSpacing:2,marginBottom:8}}>CONTAGEM DE PONTOS</div>
            <div style={{display:'flex',gap:8,justifyContent:'center'}}>
              {[{v:'territory',l:'Japonesa (Território)'},{v:'area',l:'Chinesa (Área)'}].map(function(opt){return(
                <button key={opt.v} onClick={function(){setCountMethod(opt.v);}}
                  style={{flex:1,padding:'8px 6px',fontSize:11,fontWeight:700,cursor:'pointer',borderRadius:8,
                    background:countMethod===opt.v?'rgba(241,196,15,.15)':'rgba(255,255,255,.04)',
                    border:'1px solid '+(countMethod===opt.v?'rgba(241,196,15,.5)':'rgba(255,255,255,.08)'),
                    color:countMethod===opt.v?'#f1c40f':'#666'}}>
                  {opt.l}
                </button>
              );})}
            </div>
            <div style={{color:'#444',fontSize:10,marginTop:8}}>Komi: {komi} pontos para Brancas</div>
          </div>

          <div style={{background:'rgba(0,0,0,.35)',borderRadius:14,padding:'14px',marginBottom:20,border:'1px solid rgba(255,255,255,.04)'}}>
            <div style={{color:'#555',fontSize:9,fontFamily:"'Rajdhani',sans-serif",letterSpacing:2,marginBottom:8}}>KOMI</div>
            <div style={{display:'flex',gap:6,justifyContent:'center'}}>
              {[5.5,6.5,7.5].map(function(k){return(
                <button key={k} onClick={function(){setKomi(k);}}
                  style={{flex:1,padding:'7px',fontSize:12,fontWeight:900,cursor:'pointer',borderRadius:8,
                    background:komi===k?'rgba(52,152,219,.2)':'rgba(255,255,255,.04)',
                    border:'1px solid '+(komi===k?'rgba(52,152,219,.5)':'rgba(255,255,255,.08)'),
                    color:komi===k?'#3498db':'#666',fontFamily:"'Cinzel',serif"}}>
                  {k}
                </button>
              );})}
            </div>
          </div>

          <button onClick={startGame} disabled={chips<COST}
            style={{padding:'13px 36px',
              background:chips>=COST?'linear-gradient(135deg,rgba(139,90,43,.6),rgba(80,50,20,.8))':'rgba(255,255,255,.04)',
              border:'1px solid rgba(139,90,43,.5)',borderRadius:14,
              color:chips>=COST?'#f1c40f':'#444',fontWeight:900,fontSize:15,
              cursor:chips>=COST?'pointer':'not-allowed',fontFamily:"'Cinzel',serif",letterSpacing:2}}>
            {chips>=COST?`JOGAR — ${COST} FICHA${COST>1?'S':''}`:'SALDO INSUFICIENTE'}
          </button>
        </div>
      </div>
    );
  }

  if(phase==='over'&&result){
    return(
      <div style={{padding:'16px 10px',maxWidth:460,margin:'0 auto'}}>
        <div style={{textAlign:'center',padding:'28px 20px',
          background:result.won?'rgba(46,204,113,.08)':'rgba(231,76,60,.08)',
          border:'1px solid rgba(255,255,255,.06)',borderRadius:20}}>
          <div style={{fontSize:48,marginBottom:8}}>{result.won?'🏆':'😔'}</div>
          <div style={{color:result.won?'#2ecc71':'#e74c3c',fontWeight:900,fontSize:20,fontFamily:"'Cinzel',serif",letterSpacing:2,marginBottom:8}}>
            {result.resigned?'Resignou':result.won?'VITÓRIA':'DERROTA'}
          </div>
          {!result.resigned&&(
            <div style={{marginBottom:16}}>
              <div style={{display:'flex',justifyContent:'center',gap:24,marginBottom:8}}>
                <div style={{textAlign:'center'}}>
                  <div style={{color:'#333',fontSize:10,letterSpacing:1}}>⚫ PRETAS</div>
                  <div style={{color:'#fff',fontWeight:900,fontSize:26,fontFamily:"'Cinzel',serif"}}>{result.black}</div>
                </div>
                <div style={{color:'#444',fontSize:24,alignSelf:'center'}}>vs</div>
                <div style={{textAlign:'center'}}>
                  <div style={{color:'#aaa',fontSize:10,letterSpacing:1}}>⚪ BRANCAS</div>
                  <div style={{color:'#fff',fontWeight:900,fontSize:26,fontFamily:"'Cinzel',serif"}}>{result.white}</div>
                </div>
              </div>
              <div style={{color:'#666',fontSize:12}}>
                {result.won?'Pretas vencem por '+result.diff+' pontos':'Brancas vencem por '+result.diff+' pontos'}
                {' · Komi '+komi+' · '+( countMethod==='territory'?'Japonesa':'Chinesa')}
              </div>
            </div>
          )}
          {result.won&&<div style={{color:'#2ecc71',fontSize:14,marginBottom:12}}>+{bet} fichas</div>}
          <button onClick={function(){setPhase('idle');setBoard(emptyBoard());}}
            style={{padding:'11px 28px',background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.15)',
              borderRadius:12,color:'#aaa',fontWeight:700,cursor:'pointer',fontSize:13}}>
            Nova Partida
          </button>
        </div>
      </div>
    );
  }

  // Game board
  var deadSet=new Set(deadStones);
  var svgSize=cellSize*(N+1);

  return(
    <div style={{padding:'6px 0',maxWidth:'100%',overflowX:'auto',userSelect:'none'}}>

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 10px',marginBottom:4}}>
        <div style={{display:'flex',gap:12,alignItems:'center'}}>
          <div style={{textAlign:'center'}}>
            <div style={{color:'#888',fontSize:8,letterSpacing:1}}>⚫ CAPTURADAS</div>
            <div style={{color:'#fff',fontWeight:900,fontSize:16,fontFamily:"'Cinzel',serif"}}>{caps.W}</div>
          </div>
          <div style={{textAlign:'center'}}>
            <div style={{color:'#888',fontSize:8,letterSpacing:1}}>⚪ CAPTURADAS</div>
            <div style={{color:'#fff',fontWeight:900,fontSize:16,fontFamily:"'Cinzel',serif"}}>{caps.B}</div>
          </div>
        </div>
        <div style={{textAlign:'center'}}>
          <div style={{color:'rgba(255,255,255,.3)',fontSize:9,letterSpacing:1,marginBottom:1}}>
            {phase==='scoring'?'PONTUAÇÃO':'VEZ'}
          </div>
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            {phase==='play'&&<div style={{width:14,height:14,borderRadius:'50%',background:turn==='B'?'#111':'#eee',border:turn==='B'?'2px solid #555':'2px solid #333',boxShadow:turn==='B'?'0 0 8px rgba(255,255,255,.2)':'0 0 8px rgba(0,0,0,.5)'}}/>}
            <div style={{color:thinking?'#f1c40f':turn==='B'?'#eee':'#aaa',fontWeight:900,fontSize:12,fontFamily:"'Rajdhani',sans-serif",letterSpacing:1}}>
              {thinking?'IA...':(phase==='scoring'?'MARQUE MORTAS':turn==='B'?'PRETAS':'BRANCAS')}
            </div>
          </div>
        </div>
        <div style={{display:'flex',gap:5}}>
          <button onClick={function(){setZoom(function(z){return Math.max(0.6,z-0.2);});}}
            style={{width:28,height:28,borderRadius:6,background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',color:'#888',cursor:'pointer',fontSize:14}}>-</button>
          <button onClick={function(){setZoom(function(z){return Math.min(1.4,z+0.2);});}}
            style={{width:28,height:28,borderRadius:6,background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',color:'#888',cursor:'pointer',fontSize:14}}>+</button>
        </div>
      </div>

      {msg&&<div style={{textAlign:'center',color:'rgba(255,255,255,.4)',fontSize:10,fontFamily:"'Rajdhani',sans-serif",letterSpacing:1,marginBottom:4,padding:'0 8px'}}>{msg}</div>}

      {scorePreview&&phase==='scoring'&&(
        <div style={{display:'flex',justifyContent:'center',gap:16,padding:'6px',marginBottom:4,background:'rgba(0,0,0,.3)',borderRadius:10,margin:'0 8px 6px'}}>
          <span style={{color:'#eee',fontSize:11}}>⚫ {scorePreview.black}</span>
          <span style={{color:'#888',fontSize:11}}>vs</span>
          <span style={{color:'#aaa',fontSize:11}}>⚪ {scorePreview.white}</span>
          <span style={{color:'rgba(255,255,255,.3)',fontSize:10}}>komi {komi}</span>
        </div>
      )}

      <div style={{overflowX:'auto',overflowY:'auto',maxHeight:'70vh'}}>
        <svg width={svgSize} height={svgSize}
          style={{display:'block',background:'#dcb468',cursor:phase==='play'&&turn==='B'&&!thinking?'crosshair':phase==='scoring'?'pointer':'default'}}
          onMouseLeave={function(){setHoverCell(null);}}>

          {/* Grid lines */}
          {Array.from({length:N},function(_,i){return(
            React.createElement('g',{key:i},
              React.createElement('line',{x1:cellSize,y1:cellSize*(i+1),x2:cellSize*N,y2:cellSize*(i+1),stroke:'#8B6914',strokeWidth:.8}),
              React.createElement('line',{x1:cellSize*(i+1),y1:cellSize,x2:cellSize*(i+1),y2:cellSize*N,stroke:'#8B6914',strokeWidth:.8})
            )
          );})}

          {/* Star points */}
          {STAR_POINTS.map(function(sp,i){return(
            React.createElement('circle',{key:i,cx:cellSize*(sp[1]+1),cy:cellSize*(sp[0]+1),r:3,fill:'#8B6914'})
          );})}

          {/* Coordinate labels */}
          {'ABCDEFGHJKLMNOPQRST'.split('').slice(0,N).map(function(l,i){return(
            React.createElement('g',{key:i},
              React.createElement('text',{x:cellSize*(i+1),y:cellSize*.55,fill:'#8B6914',fontSize:9,textAnchor:'middle',fontFamily:'monospace'},l),
              React.createElement('text',{x:cellSize*(i+1),y:cellSize*(N+.65),fill:'#8B6914',fontSize:9,textAnchor:'middle',fontFamily:'monospace'},l)
            )
          );})}
          {Array.from({length:N},function(_,i){return(
            React.createElement('g',{key:i},
              React.createElement('text',{x:cellSize*.55,y:cellSize*(i+1)+4,fill:'#8B6914',fontSize:9,textAnchor:'middle',fontFamily:'monospace'},N-i),
              React.createElement('text',{x:cellSize*(N+.65),y:cellSize*(i+1)+4,fill:'#8B6914',fontSize:9,textAnchor:'middle',fontFamily:'monospace'},N-i)
            )
          );})}

          {/* Hover indicator */}
          {hoverCell&&phase==='play'&&turn==='B'&&!thinking&&goLegal(board,hoverCell[0],hoverCell[1],'B',prevBoard,N)&&(
            React.createElement('circle',{
              cx:cellSize*(hoverCell[1]+1),cy:cellSize*(hoverCell[0]+1),
              r:cellSize*.42,fill:'rgba(0,0,0,.25)',stroke:'rgba(0,0,0,.4)',strokeWidth:1
            })
          )}

          {/* Stones */}
          {board.map(function(row,ri){return row.map(function(cell,ci){
            if(!cell)return null;
            var isDead=deadSet.has(ri+','+ci);
            var isLast=lastMove&&lastMove[0]===ri&&lastMove[1]===ci;
            var cx=cellSize*(ci+1),cy=cellSize*(ri+1);
            var r=cellSize*.44;
            return React.createElement('g',{
              key:ri+','+ci,
              onClick:function(){if(phase==='scoring')toggleDead(ri,ci);}
            },
              React.createElement('circle',{cx:cx,cy:cy,r:r,
                fill:cell==='B'?'#111':'#f0f0f0',
                stroke:cell==='B'?'#000':'#999',strokeWidth:.8,
                opacity:isDead?.3:1,
                style:{filter:cell==='B'?'drop-shadow(1px 2px 2px rgba(0,0,0,.6))':'drop-shadow(1px 2px 2px rgba(0,0,0,.3))'}
              }),
              isDead&&React.createElement('line',{x1:cx-r*.6,y1:cy-r*.6,x2:cx+r*.6,y2:cy+r*.6,stroke:'red',strokeWidth:2}),
              isDead&&React.createElement('line',{x1:cx+r*.6,y1:cy-r*.6,x2:cx-r*.6,y2:cy+r*.6,stroke:'red',strokeWidth:2}),
              isLast&&React.createElement('circle',{cx:cx,cy:cy,r:r*.3,fill:cell==='B'?'#fff':'#555'})
            );
          });})  }

          {/* Invisible click targets */}
          {Array.from({length:N},function(_,ri){return Array.from({length:N},function(_,ci){
            return React.createElement('rect',{
              key:ri+','+ci,
              x:cellSize*(ci+1)-cellSize*.5,y:cellSize*(ri+1)-cellSize*.5,
              width:cellSize,height:cellSize,
              fill:'transparent',
              onMouseEnter:function(){setHoverCell([ri,ci]);},
              onClick:function(){
                if(phase==='play')placeStone(ri,ci);
                else if(phase==='scoring')toggleDead(ri,ci);
              }
            });
          });})  }
        </svg>
      </div>

      <div style={{display:'flex',gap:6,justifyContent:'center',padding:'8px 10px',flexWrap:'wrap'}}>
        {phase==='play'&&(
          React.createElement(React.Fragment,null,
            React.createElement('button',{onClick:pass,disabled:turn!=='B'||thinking,
              style:{padding:'9px 18px',background:'rgba(52,152,219,.1)',border:'1px solid rgba(52,152,219,.3)',
                borderRadius:10,color:turn==='B'&&!thinking?'#3498db':'#444',fontWeight:700,cursor:turn==='B'&&!thinking?'pointer':'not-allowed',fontSize:12,fontFamily:"'Cinzel',serif"}},
              'PASSAR'),
            React.createElement('button',{onClick:resign,
              style:{padding:'9px 18px',background:'rgba(231,76,60,.08)',border:'1px solid rgba(231,76,60,.25)',
                borderRadius:10,color:'#c0392b',fontWeight:700,cursor:'pointer',fontSize:12,fontFamily:"'Cinzel',serif"}},
              'RESIGNAR')
          )
        )}
        {phase==='scoring'&&(
          React.createElement(React.Fragment,null,
            React.createElement('button',{onClick:confirmScore,
              style:{padding:'9px 20px',background:'rgba(46,204,113,.15)',border:'1px solid rgba(46,204,113,.4)',
                borderRadius:10,color:'#2ecc71',fontWeight:900,cursor:'pointer',fontSize:13,fontFamily:"'Cinzel',serif"}},
              'CONFIRMAR PONTUACAO'),
            React.createElement('button',{onClick:function(){setPhase('play');setDeadStones([]);setMsg('Jogo retomado');},
              style:{padding:'9px 14px',background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',
                borderRadius:10,color:'#888',fontWeight:700,cursor:'pointer',fontSize:12}},
              'Continuar')
          )
        )}
      </div>
    </div>
  );
}

// ── GoOnline ──────────────────────────────────────────────────
function GoOnline({socket,room,userData,onGameOver}){
  var N=19;
  var KOMI=6.5;
  function emptyBoard(){return Array.from({length:N},function(){return new Array(N).fill(null);});}
  function copyBoard(b){return b.map(function(r){return r.slice();});}

  var [board,setBoard]=useState(emptyBoard());
  var [prevBoard,setPrevBoard]=useState(null);
  var [myColor,setMyColor]=useState(null);
  var [turn,setTurn]=useState('B');
  var [phase,setPhase]=useState('wait');
  var [passCount,setPassCount]=useState(0);
  var [caps,setCaps]=useState({B:0,W:0});
  var [msg,setMsg]=useState('Aguardando inicio...');
  var [result,setResult]=useState(null);
  var [lastMove,setLastMove]=useState(null);
  var [deadStones,setDeadStones]=useState([]);
  var [scorePreview,setScorePreview]=useState(null);
  var [countMethod,setCountMethod]=useState('territory');
  var [komi,setKomi]=useState(KOMI);
  var [initialized,setInitialized]=useState(false);
  var [rulesReady,setRulesReady]=useState(false);
  var [rules,setRules]=useState({countMethod:'territory',komi:6.5});
  var [zoom,setZoom]=useState(1);
  var [hoverCell,setHoverCell]=useState(null);
  var CELL=28*zoom;

  var opp=room.players.find(function(p){return p.uid!==userData?.uid;});
  var oppName=opp?.name||'Adversario';
  var isCriador=room.players[0]?.uid===userData?.uid;
  var myTurn=turn===myColor;
  var deadSet=new Set(deadStones);
  var STAR_POINTS=[[3,3],[3,9],[3,15],[9,3],[9,9],[9,15],[15,3],[15,9],[15,15]];

  useEffect(function(){
    if(!socket||initialized)return;
    setInitialized(true);

    socket.on('game_action',function(evt){
      var action=evt.action,data=evt.data,sUid=evt.uid;
      if(action==='go_start'){
        var mc=data.colors[userData?.uid];
        setMyColor(mc);
        setBoard(emptyBoard());
        setPrevBoard(null);
        setTurn('B');
        setPhase('play');
        setCountMethod(data.countMethod||'territory');
        setKomi(data.komi||6.5);
        setPassCount(0);
        setCaps({B:0,W:0});
        setMsg(mc==='B'?'Sua vez (Pretas)':'Vez das Pretas...');
        setLastMove(null);
      }
      if(action==='go_rules_chosen'){
        setRules(data.rules);
        setRulesReady(true);
        if(!isCriador){
          socket.emit('game_action',{roomId:room.id,action:'go_init',data:{uid:userData?.uid,rules:data.rules}});
        }
      }
      if(action==='go_move'){
        var r=data.r,c=data.c,color=data.color;
        setBoard(function(b){
          var nb=copyBoard(b);
          nb[r][c]=color;
          var captured=goCapture(nb,r,c,N);
          setCaps(function(cp){
            var nc={B:cp.B,W:cp.W};
            nc[color==='B'?'W':'B']+=captured.length;
            return nc;
          });
          setPrevBoard(copyBoard(b));
          return nb;
        });
        setLastMove([r,c]);
        setTurn(function(t){var nt=t==='B'?'W':'B';return nt;});
        setPassCount(0);
        setMsg(data.color===myColor?'Vez do adversario...':'Sua vez!');
      }
      if(action==='go_pass'){
        setPassCount(function(p){return p+1;});
        setMsg(sUid===userData?.uid?'Voce passou.':'Adversario passou.');
        setTurn(function(t){return t==='B'?'W':'B';});
      }
      if(action==='go_scoring'){
        setPhase('scoring');
        setMsg('Marque as pedras mortas e confirme');
        setBoard(function(b){var sc=goScore(b,N,komi,countMethod);setScorePreview(sc);return b;});
      }
      if(action==='go_win'){
        var won=data.winnerId===userData?.uid;
        setResult({won:won,black:data.black,white:data.white,diff:data.diff,resigned:data.resigned});
        setPhase('over');
        onGameOver&&onGameOver();
      }
    });
    return function(){socket.off('game_action');};
  },[socket]);

  function placeStone(r,c){
    if(!myTurn||phase!=='play')return;
    if(!goLegal(board,r,c,myColor,prevBoard,N)){setMsg('Movimento ilegal!');return;}
    socket.emit('game_action',{roomId:room.id,action:'go_move',data:{r:r,c:c,color:myColor,uid:userData?.uid}});
  }

  function pass2(){
    if(!myTurn||phase!=='play')return;
    socket.emit('game_action',{roomId:room.id,action:'go_pass',data:{uid:userData?.uid}});
  }

  function resign2(){
    socket.emit('game_action',{roomId:room.id,action:'go_resign',data:{uid:userData?.uid}});
  }

  function toggleDead2(r,c){
    if(phase!=='scoring')return;
    if(!board[r][c])return;
    var key=r+','+c;
    var g=goGroup(board,r,c,N);
    var keys=g.stones.map(function(s){return s[0]+','+s[1];});
    setDeadStones(function(ds){
      var set=new Set(ds);
      var allDead=keys.every(function(k){return set.has(k);});
      if(allDead)keys.forEach(function(k){set.delete(k);});
      else keys.forEach(function(k){set.add(k);});
      return Array.from(set);
    });
  }

  function confirmScore2(){
    socket.emit('game_action',{roomId:room.id,action:'go_confirm_score',data:{deadStones:deadStones,uid:userData?.uid}});
  }

  if(!rulesReady&&phase==='wait'){
    if(isCriador) return(
      <div style={{padding:'20px 12px',maxWidth:460,margin:'0 auto'}}>
        <div style={{color:'#f1c40f',fontWeight:900,fontSize:16,fontFamily:"'Cinzel',serif",textAlign:'center',marginBottom:16,letterSpacing:2}}>⚙️ REGRAS DA PARTIDA</div>
        <div style={{marginBottom:12,background:'rgba(255,255,255,.03)',border:'1px solid rgba(255,255,255,.06)',borderRadius:12,padding:'12px'}}>
          <div style={{color:'#ddd',fontSize:12,fontWeight:700,marginBottom:6}}>Contagem de pontos</div>
          <div style={{display:'flex',gap:8}}>
            {[{v:'territory',l:'Japonesa (Territorio)'},{v:'area',l:'Chinesa (Area)'}].map(function(opt){return(
              <button key={opt.v} onClick={function(){setRules(function(r){return{...r,countMethod:opt.v};});}}
                style={{flex:1,padding:'8px 5px',fontSize:11,fontWeight:700,cursor:'pointer',borderRadius:8,
                  background:rules.countMethod===opt.v?'rgba(241,196,15,.2)':'rgba(255,255,255,.04)',
                  border:'1px solid '+(rules.countMethod===opt.v?'#f1c40f':'rgba(255,255,255,.1)'),
                  color:rules.countMethod===opt.v?'#f1c40f':'#666'}}>
                {opt.l}
              </button>
            );})}
          </div>
        </div>
        <div style={{marginBottom:16,background:'rgba(255,255,255,.03)',border:'1px solid rgba(255,255,255,.06)',borderRadius:12,padding:'12px'}}>
          <div style={{color:'#ddd',fontSize:12,fontWeight:700,marginBottom:6}}>Komi</div>
          <div style={{display:'flex',gap:6}}>
            {[5.5,6.5,7.5].map(function(k){return(
              <button key={k} onClick={function(){setRules(function(r){return{...r,komi:k};});}}
                style={{flex:1,padding:'7px',fontSize:12,fontWeight:900,cursor:'pointer',borderRadius:8,
                  background:rules.komi===k?'rgba(52,152,219,.2)':'rgba(255,255,255,.04)',
                  border:'1px solid '+(rules.komi===k?'rgba(52,152,219,.5)':'rgba(255,255,255,.08)'),
                  color:rules.komi===k?'#3498db':'#666',fontFamily:"'Cinzel',serif"}}>
                {k}
              </button>
            );})}
          </div>
        </div>
        <button onClick={function(){
          setRulesReady(true);
          socket.emit('game_action',{roomId:room.id,action:'go_rules_chosen',data:{rules:rules}});
          socket.emit('game_action',{roomId:room.id,action:'go_init',data:{uid:userData?.uid,rules:rules}});
        }}
          style={{width:'100%',padding:'14px',background:'rgba(46,204,113,.15)',border:'1px solid rgba(46,204,113,.4)',
            borderRadius:13,color:'#2ecc71',fontWeight:900,fontSize:15,cursor:'pointer',fontFamily:"'Cinzel',serif",letterSpacing:1}}>
          CONFIRMAR E INICIAR
        </button>
      </div>
    );
    return(
      <div style={{padding:'30px 12px',textAlign:'center'}}>
        <div style={{fontSize:36,marginBottom:12}}>⏳</div>
        <div style={{color:'#aaa',fontSize:13}}>Aguardando o criador configurar as regras...</div>
      </div>
    );
  }

  if(result) return(
    <div style={{padding:'16px 10px',maxWidth:460,margin:'0 auto'}}>
      <div style={{textAlign:'center',padding:'28px 20px',
        background:result.won?'rgba(46,204,113,.08)':'rgba(231,76,60,.08)',
        border:'1px solid rgba(255,255,255,.06)',borderRadius:20}}>
        <div style={{fontSize:48,marginBottom:8}}>{result.won?'🏆':'😔'}</div>
        <div style={{color:result.won?'#2ecc71':'#e74c3c',fontWeight:900,fontSize:20,fontFamily:"'Cinzel',serif",marginBottom:8}}>
          {result.resigned?'Resignou':result.won?'VITORIA':'DERROTA'}
        </div>
        {!result.resigned&&(
          <div style={{display:'flex',justifyContent:'center',gap:20,marginBottom:8}}>
            <div style={{textAlign:'center'}}>
              <div style={{color:'#555',fontSize:10}}>PRETAS</div>
              <div style={{color:'#fff',fontWeight:900,fontSize:24,fontFamily:"'Cinzel',serif"}}>{result.black}</div>
            </div>
            <div style={{color:'#444',fontSize:20,alignSelf:'center'}}>vs</div>
            <div style={{textAlign:'center'}}>
              <div style={{color:'#555',fontSize:10}}>BRANCAS</div>
              <div style={{color:'#fff',fontWeight:900,fontSize:24,fontFamily:"'Cinzel',serif"}}>{result.white}</div>
            </div>
          </div>
        )}
        {result.won&&<div style={{color:'#2ecc71',fontSize:14,marginBottom:8}}>+{room.betAmount} fichas</div>}
      </div>
    </div>
  );

  var svgSize=CELL*(N+1);
  return(
    <div style={{padding:'6px 0',maxWidth:'100%',userSelect:'none'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 10px',marginBottom:4}}>
        <div style={{display:'flex',gap:10}}>
          <div style={{textAlign:'center'}}>
            <div style={{color:'#888',fontSize:8,letterSpacing:1}}>⚫ CAP</div>
            <div style={{color:'#fff',fontWeight:900,fontSize:14,fontFamily:"'Cinzel',serif"}}>{caps.W}</div>
          </div>
          <div style={{textAlign:'center'}}>
            <div style={{color:'#888',fontSize:8,letterSpacing:1}}>⚪ CAP</div>
            <div style={{color:'#fff',fontWeight:900,fontSize:14,fontFamily:"'Cinzel',serif"}}>{caps.B}</div>
          </div>
        </div>
        <div style={{textAlign:'center'}}>
          {myColor&&<div style={{color:myColor==='B'?'#eee':'#aaa',fontSize:10,fontFamily:"'Rajdhani',sans-serif",letterSpacing:1}}>
            Voce: {myColor==='B'?'PRETAS':'BRANCAS'}
          </div>}
          <div style={{color:myTurn?'#2ecc71':'rgba(255,255,255,.3)',fontSize:11,fontWeight:900,fontFamily:"'Rajdhani',sans-serif",letterSpacing:1}}>
            {phase==='scoring'?'PONTUACAO':myTurn?'SUA VEZ':'ADVERSARIO'}
          </div>
        </div>
        <div style={{display:'flex',gap:4}}>
          <button onClick={function(){setZoom(function(z){return Math.max(0.5,z-0.2);});}} style={{width:26,height:26,borderRadius:5,background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',color:'#888',cursor:'pointer',fontSize:13}}>-</button>
          <button onClick={function(){setZoom(function(z){return Math.min(1.4,z+0.2);});}} style={{width:26,height:26,borderRadius:5,background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',color:'#888',cursor:'pointer',fontSize:13}}>+</button>
        </div>
      </div>
      {msg&&<div style={{textAlign:'center',color:'rgba(255,255,255,.35)',fontSize:10,fontFamily:"'Rajdhani',sans-serif",letterSpacing:1,marginBottom:4}}>{msg}</div>}
      {scorePreview&&phase==='scoring'&&(
        <div style={{display:'flex',justifyContent:'center',gap:16,padding:'5px',marginBottom:4,background:'rgba(0,0,0,.3)',borderRadius:8,margin:'0 8px 5px'}}>
          <span style={{color:'#eee',fontSize:11}}>⚫ {scorePreview.black}</span>
          <span style={{color:'#888',fontSize:11}}>vs</span>
          <span style={{color:'#aaa',fontSize:11}}>⚪ {scorePreview.white}</span>
        </div>
      )}
      <div style={{overflowX:'auto',overflowY:'auto',maxHeight:'65vh'}}>
        <svg width={svgSize} height={svgSize} style={{display:'block',background:'#dcb468',cursor:myTurn&&phase==='play'?'crosshair':phase==='scoring'?'pointer':'default'}}
          onMouseLeave={function(){setHoverCell(null);}}>
          {Array.from({length:N},function(_,i){return(
            React.createElement('g',{key:i},
              React.createElement('line',{x1:CELL,y1:CELL*(i+1),x2:CELL*N,y2:CELL*(i+1),stroke:'#8B6914',strokeWidth:.8}),
              React.createElement('line',{x1:CELL*(i+1),y1:CELL,x2:CELL*(i+1),y2:CELL*N,stroke:'#8B6914',strokeWidth:.8})
            )
          );})}
          {STAR_POINTS.map(function(sp,i){return React.createElement('circle',{key:i,cx:CELL*(sp[1]+1),cy:CELL*(sp[0]+1),r:3,fill:'#8B6914'});})}
          {hoverCell&&myTurn&&phase==='play'&&goLegal(board,hoverCell[0],hoverCell[1],myColor,prevBoard,N)&&(
            React.createElement('circle',{cx:CELL*(hoverCell[1]+1),cy:CELL*(hoverCell[0]+1),r:CELL*.42,fill:'rgba(0,0,0,.25)',stroke:'rgba(0,0,0,.4)',strokeWidth:1})
          )}
          {board.map(function(row,ri){return row.map(function(cell,ci){
            if(!cell)return null;
            var isDead=deadSet.has(ri+','+ci);
            var isLast=lastMove&&lastMove[0]===ri&&lastMove[1]===ci;
            var cx=CELL*(ci+1),cy=CELL*(ri+1),r=CELL*.44;
            return React.createElement('g',{key:ri+','+ci,onClick:function(){if(phase==='scoring')toggleDead2(ri,ci);}},
              React.createElement('circle',{cx:cx,cy:cy,r:r,fill:cell==='B'?'#111':'#f0f0f0',stroke:cell==='B'?'#000':'#999',strokeWidth:.8,opacity:isDead?.3:1,style:{filter:cell==='B'?'drop-shadow(1px 2px 2px rgba(0,0,0,.6))':'drop-shadow(1px 2px 2px rgba(0,0,0,.3))'}}),
              isDead&&React.createElement('line',{x1:cx-r*.6,y1:cy-r*.6,x2:cx+r*.6,y2:cy+r*.6,stroke:'red',strokeWidth:2}),
              isDead&&React.createElement('line',{x1:cx+r*.6,y1:cy-r*.6,x2:cx-r*.6,y2:cy+r*.6,stroke:'red',strokeWidth:2}),
              isLast&&React.createElement('circle',{cx:cx,cy:cy,r:r*.3,fill:cell==='B'?'#fff':'#555'})
            );
          });})  }
          {Array.from({length:N},function(_,ri){return Array.from({length:N},function(_,ci){
            return React.createElement('rect',{key:ri+','+ci,x:CELL*(ci+1)-CELL*.5,y:CELL*(ri+1)-CELL*.5,width:CELL,height:CELL,fill:'transparent',
              onMouseEnter:function(){setHoverCell([ri,ci]);},
              onClick:function(){if(phase==='play')placeStone(ri,ci);else if(phase==='scoring')toggleDead2(ri,ci);}});
          });})  }
        </svg>
      </div>
      <div style={{display:'flex',gap:6,justifyContent:'center',padding:'8px 10px',flexWrap:'wrap'}}>
        {phase==='play'&&myTurn&&React.createElement(React.Fragment,null,
          React.createElement('button',{onClick:pass2,style:{padding:'9px 18px',background:'rgba(52,152,219,.1)',border:'1px solid rgba(52,152,219,.3)',borderRadius:10,color:'#3498db',fontWeight:700,cursor:'pointer',fontSize:12,fontFamily:"'Cinzel',serif"}},'PASSAR'),
          React.createElement('button',{onClick:resign2,style:{padding:'9px 18px',background:'rgba(231,76,60,.08)',border:'1px solid rgba(231,76,60,.25)',borderRadius:10,color:'#c0392b',fontWeight:700,cursor:'pointer',fontSize:12,fontFamily:"'Cinzel',serif"}},'RESIGNAR')
        )}
        {phase==='scoring'&&React.createElement(React.Fragment,null,
          React.createElement('button',{onClick:confirmScore2,style:{padding:'9px 20px',background:'rgba(46,204,113,.15)',border:'1px solid rgba(46,204,113,.4)',borderRadius:10,color:'#2ecc71',fontWeight:900,cursor:'pointer',fontSize:13,fontFamily:"'Cinzel',serif"}},'CONFIRMAR PONTUACAO'),
          React.createElement('button',{onClick:function(){setPhase('play');setDeadStones([]);setMsg('Jogo retomado');},style:{padding:'9px 14px',background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)',borderRadius:10,color:'#888',fontWeight:700,cursor:'pointer',fontSize:12}},'Continuar')
        )}
      </div>
    </div>
  );
}


function App(){
  const [authUser,setAuthUser]=useState(null);
  const [userData,setUserData]=useState(null);
  const [token,setToken]=useState(null);
  const [authLoading,setAuthLoading]=useState(true);
  const [screen,setScreen]=useState('home');
  const [showShop,setShowShop]=useState(false);
  const [showProfile,setShowProfile]=useState(false);
  const [showAbout,setShowAbout]=useState(false);
  const [socket,setSocket]=useState(null);
  const [feed,setFeed]=useState(['🎰 Bem-vindo ao Cassino AR!']);
  const [toast,setToast]=useState(null);
  const [gameMode,setGameMode]=useState('offline'); // offline | online

  const showToast=(msg,type='success')=>{setToast({msg,type});setTimeout(()=>setToast(null),4000);};
  const showInterstitialAd=React.useCallback(async()=>{
    if(window.AdMobHelper) await window.AdMobHelper.showInterstitial();
  },[]);

  const log=useCallback(m=>setFeed(f=>[m,...f.slice(0,29)]),[]);

  useEffect(()=>{
    return auth.onAuthStateChanged(async u=>{
      if(u){
        setAuthUser(u);
        let t;
        try{ t=await u.getIdToken(true); }
        catch(e){ t=await u.getIdToken(); } // fallback sem forceRefresh
        setToken(t);
        // Renova token a cada 50min — NÃO usa return aqui (bloquearia o restante)
        if(!window._tokenRefreshInterval) {
          window._tokenRefreshInterval = setInterval(async()=>{
            try{
              const newT = await u.getIdToken(true);
              setToken(newT);
            }catch(e){}
          }, 50*60*1000);
        }
        // Tenta carregar do Firestore primeiro
        try{
          const snap=await db.collection('users').doc(u.uid).get();
          if(snap.exists){
            const snapData = snap.data();
            // Corrige saldo negativo automaticamente
            if((snapData.chips||0) < 0){
              db.collection('users').doc(u.uid).update({chips:0}).catch(()=>{});
              snapData.chips = 0;
            }
            setUserData(snapData);
            window._cachedUid = snapData?.uid;
            localStorage.setItem('cassino_user_'+u.uid, JSON.stringify(snap.data()));
          } else {
            // Novo usuário — cria perfil
            const newUser={uid:u.uid,name:u.displayName||u.email?.split('@')[0]||'Jogador',email:u.email,avatar:'🎰',chips:15,totalDeposited:0,totalWithdrawn:0,createdAt:new Date().toISOString()};
            await db.collection('users').doc(u.uid).set(newUser);
            setUserData(newUser);
            localStorage.setItem('cassino_user_'+u.uid, JSON.stringify(newUser));
            // Tenta avisar o backend também (não bloqueia)
            fetch(`${BACKEND_URL}/api/auth/profile`,{method:'POST',headers:{'Authorization':`Bearer ${t}`}}).catch(()=>{});
          }
        }catch(err){
          // Fallback: usa cache local
          const cached=localStorage.getItem('cassino_user_'+u.uid);
          if(cached){
            setUserData(JSON.parse(cached));
          }else{
            const fallback={uid:u.uid,name:u.displayName||u.email?.split('@')[0]||'Jogador',email:u.email,avatar:'🎰',chips:10};
            setUserData(fallback);
          }
        }
      }else{setAuthUser(null);setUserData(null);setToken(null);}
      setAuthLoading(false);
    });
  },[]);

  // Firestore listener tempo real
  useEffect(()=>{
    if(!authUser)return;
    const unsub=db.collection('users').doc(authUser.uid).onSnapshot(snap=>{
      if(snap.exists){
        const data=snap.data();
        setUserData(data);
        localStorage.setItem('cassino_user_'+authUser.uid, JSON.stringify(data));
      }
    },(err)=>{
      // Se Firestore falhar, mantém o estado atual
      console.warn('Firestore listener error:', err);
    });
    return unsub;
  },[authUser]);

  // Socket.io
  useEffect(()=>{
    if(!authUser||!token||gameMode!=='online')return;
    const s=window.io(BACKEND_URL,{auth:{token}});
    s.on('connect',()=>{showToast('🌐 Conectado!');log('🌐 Online!');});
    s.on('connect_error',(err)=>{
      console.error('Socket connect_error:',err.message);
      showToast('❌ Servidor offline. Tente mais tarde.','error');
    });
    s.on('disconnect',(reason)=>{
      if(reason!=='io client disconnect') showToast('⚠️ Conexão perdida.','error');
    });
    s.on('chips_credited',({chips,message})=>{showToast(message);log(message);});
    s.on('error',({message})=>showToast(message,'error'));
    setSocket(s);
    return()=>{s.disconnect();setSocket(null);};
  },[authUser,token,gameMode]);

  const chips=Math.max(0,userData?.chips||0);

  // ── Sistema de fichas ÚNICO — online e offline usam o mesmo saldo ──
  const FREE_CHIPS_PER_AD = 10; // 10 fichas por anúncio (30 segundos)
  const [showAdModal, setShowAdModal] = useState(false);
  const [adWatching, setAdWatching] = useState(false);
  const [adTimer, setAdTimer] = useState(0);

  // onChange — sempre salva no Firestore (funciona nos dois modos)
  const onChange=useCallback(async delta=>{
    setUserData(d=>{
      if(!d) return d;
      const current = Math.max(0, d.chips||0);
      const next = Math.max(0, current + delta);
      db.collection('users').doc(d.uid).update({chips: next}).catch(()=>{});
      const updated = {...d, chips: next};
      localStorage.setItem('cassino_user_'+d.uid, JSON.stringify(updated));
      if(next <= 0 && delta < 0) setTimeout(()=>setShowAdModal(true), 500);
      return updated;
    });
  },[]);

  // ── Streak diário de anúncios ──
  const getAdStreak = () => {
    try {
      const uid = userData?.uid; if(!uid) return {days:0,lastDate:null,weekBonus:false};
      const saved = localStorage.getItem('ad_streak_'+uid);
      return saved ? JSON.parse(saved) : {days:0,lastDate:null,weekBonusClaimed:false};
    } catch { return {days:0,lastDate:null,weekBonusClaimed:false}; }
  };

  const updateAdStreak = () => {
    try {
      const uid = userData?.uid; if(!uid) return 0;
      const today = new Date().toDateString();
      const streak = getAdStreak();
      // Contar total de anúncios assistidos esta semana
      const weekKey = 'ad_week_'+uid;
      let weekData = {count:0, weekStart: getWeekStart(), bonusClaimed:false};
      try { const s=localStorage.getItem(weekKey); if(s) weekData=JSON.parse(s); } catch{}
      // Resetar se nova semana
      if(weekData.weekStart !== getWeekStart()){
        weekData = {count:0, weekStart:getWeekStart(), bonusClaimed:false};
      }
      weekData.count = (weekData.count||0) + 1;
      // Atualizar streak de dias
      let bonus = 0;
      if(streak.lastDate !== today){
        const yesterday = new Date(Date.now()-86400000).toDateString();
        const newDays = streak.lastDate === yesterday ? streak.days + 1 : 1;
        const newStreak = {days:newDays, lastDate:today, weekBonusClaimed:streak.weekBonusClaimed};
        // Bônus semanal: 6 dias úteis + 100 anúncios na semana
        if(newDays >= 6 && weekData.count >= 100 && !weekData.bonusClaimed){
          bonus = 60;
          newStreak.days = 0;
          weekData.bonusClaimed = true;
        }
        localStorage.setItem('ad_streak_'+uid, JSON.stringify(newStreak));
      }
      localStorage.setItem(weekKey, JSON.stringify(weekData));
      return bonus;
    } catch { return 0; }
  };

  function getWeekStart(){
    const d=new Date(); d.setHours(0,0,0,0);
    d.setDate(d.getDate()-d.getDay()); // domingo
    return d.toDateString();
  }

  const watchAd = async () => {
    setAdWatching(true);
    // Tenta anúncio real via AdMob (Capacitor)
    const helper = window.AdMobHelper;
    if(helper){
      try {
        const rewarded = await helper.showRewarded();
        setAdWatching(false);
        setShowAdModal(false);
        if(rewarded){
          onChange(FREE_CHIPS_PER_AD);
        } else {
          // Usuário fechou antes do fim — não recompensa
        }
        return;
      } catch(e){ console.warn('AdMob rewarded error:', e); }
    }
    // Fallback: simulação (browser/dev)
    setAdTimer(30);
    const interval = setInterval(()=>{
      setAdTimer(t=>{
        if(t<=1){
          clearInterval(interval);
          setAdWatching(false);
          setShowAdModal(false);
          onChange(FREE_CHIPS_PER_AD);
          const wb = updateAdStreak();
          if(wb > 0) setTimeout(()=>{ onChange(wb); }, 800);
          return 0;
        }
        return t-1;
      });
    },1000);
  };

  // Fichas únicas — mesmas em online e offline
  const displayChips = Math.max(0, chips);

  // Exibe banner AdMob ao entrar no app
  React.useEffect(()=>{
    if(authUser) window.AdMobHelper?.showBanner();
    else window.AdMobHelper?.hideBanner();
  },[authUser]);

    domino:<Dominoes chips={displayChips} onChange={onChange} log={log} mode={gameMode}/>,
    dama:<Dama chips={displayChips} onChange={onChange} log={log} mode={gameMode}/>,
    xadrez:<Xadrez chips={displayChips} onChange={onChange} log={log} mode={gameMode}/>,
    poker:<Poker chips={displayChips} onChange={onChange} log={log} mode={gameMode}/>,
    go:<Go chips={displayChips} onChange={onChange} log={log} mode={gameMode}/>,
    lobby:<OnlineLobby socket={socket} chips={displayChips} userData={userData} onChange={onChange}/>,
  };

  const nav=[
    {k:"home",i:"🏠",l:"Início"},
    {k:"pife",i:"🃏",l:"Pife"},
    {k:"domino",i:"🁣",l:"Dominó"},
    {k:"dama",i:"♟",l:"Dama"},
    {k:"xadrez",i:"♔",l:"Xadrez"},
    {k:"poker",i:"♠",l:"Poker"},
    {k:"go",i:"⚫",l:"Go"},
    {k:"lobby",i:"🌐",l:"Online"},
    {k:"shop_btn",i:"💰",l:"Fichas"},
  ];

  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(160deg,#050505 0%,#0a1a0a 50%,#050a14 100%)",fontFamily:"Georgia,serif",color:"#fff",display:"flex",flexDirection:"column"}}>

      {/* Toast */}
      {toast&&<div style={{position:"fixed",top:65,left:"50%",transform:"translateX(-50%)",zIndex:9999,background:toast.type==='success'?"rgba(46,204,113,.95)":"rgba(231,76,60,.95)",color:"#fff",padding:"10px 20px",borderRadius:10,fontSize:13,fontWeight:700,boxShadow:"0 4px 20px rgba(0,0,0,.5)",animation:"fadeIn .3s ease",whiteSpace:"nowrap",maxWidth:"90vw",textAlign:"center"}}>{toast.msg}</div>}

      {/* Header */}
      <div style={{position:"sticky",top:0,zIndex:200,background:"rgba(4,4,4,.97)",backdropFilter:"blur(20px)",borderBottom:"1px solid rgba(241,196,15,.22)",height:56,display:"flex",alignItems:"center",padding:"0 12px",gap:10}}>
        <div style={{flex:1,fontWeight:900,fontSize:18,color:"#f1c40f",letterSpacing:".06em",cursor:"pointer"}} onClick={()=>setScreen('home')}>🎰 CASSINO AR</div>

        {/* Modo Online/Offline */}
        <button onClick={()=>setGameMode(m=>m==='offline'?'online':'offline')}
          style={{background:gameMode==='online'?"rgba(46,204,113,.15)":"rgba(255,255,255,.05)",border:`1px solid ${gameMode==='online'?"rgba(46,204,113,.4)":"rgba(255,255,255,.1)"}`,borderRadius:8,color:gameMode==='online'?"#2ecc71":"#666",padding:"4px 10px",cursor:"pointer",fontSize:10,fontWeight:700,fontFamily:"Georgia,serif",whiteSpace:"nowrap"}}>
          {gameMode==='online'?"🌐 Online":"📴 Offline"}
        </button>

        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div onClick={()=>setShowShop(true)} style={{cursor:"pointer",textAlign:"right"}}>
            <div style={{color:"#f1c40f",fontWeight:900,fontSize:15}}>{chips.toLocaleString()}</div>
            <div style={{color:"#555",fontSize:9}}>fichas</div>
          </div>
          <button onClick={()=>setShowProfile(true)} style={{width:34,height:34,borderRadius:"50%",background:"rgba(241,196,15,.1)",border:"1px solid rgba(241,196,15,.25)",cursor:"pointer",fontSize:18,display:"flex",alignItems:"center",justifyContent:"center"}}>
            {userData?.avatar||"🎰"}
          </button>
        </div>
      </div>

      {/* Main */}
      <div style={{flex:1,zIndex:1,overflowY:"auto",paddingBottom:72}}>
        {screen==="home"&&(
          <div style={{padding:"16px 12px",maxWidth:500,margin:"0 auto",animation:"fadeIn .4s ease"}}>

            {/* Banner de saldo */}
            <div style={{background:"linear-gradient(135deg,#0d0a00 0%,#1a1200 50%,#0d0800 100%)",border:"1px solid rgba(241,196,15,.2)",borderRadius:20,padding:"16px 18px",marginBottom:14,position:"relative",overflow:"hidden"}}>
              <div style={{position:"absolute",top:-20,right:-20,width:120,height:120,borderRadius:"50%",background:"radial-gradient(circle,rgba(241,196,15,.08) 0%,transparent 70%)"}}/>
              <div style={{position:"absolute",bottom:-30,left:-10,width:80,height:80,borderRadius:"50%",background:"radial-gradient(circle,rgba(192,57,43,.06) 0%,transparent 70%)"}}/>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",position:"relative"}}>
                <div>
                  <div style={{color:"rgba(255,255,255,.4)",fontSize:11,fontFamily:"'Rajdhani',sans-serif",letterSpacing:2,marginBottom:4}}>
                    {gameMode==='offline'?'FICHAS GRÁTIS':'SEU SALDO'}
                  </div>
                  <div style={{display:"flex",alignItems:"baseline",gap:6}}>
                    <span style={{color:gameMode==='online'&&chips<=0?"#e74c3c":"#f1c40f",fontSize:42,fontWeight:900,fontFamily:"'Cinzel',Georgia,serif",lineHeight:1}}>
                      {displayChips.toLocaleString()}
                    </span>
                    <span style={{color:"rgba(241,196,15,.4)",fontSize:13,fontFamily:"'Rajdhani',sans-serif",letterSpacing:2}}>FIC</span>
                  </div>
                  {chips>0&&<div style={{color:"rgba(255,255,255,.25)",fontSize:10,marginTop:2,letterSpacing:1}}>≈ R$ {CHIP_TO_BRL(chips)}</div>}
                  {gameMode==='offline'&&<div style={{color:"#2ecc71",fontSize:10,marginTop:2,letterSpacing:1,fontFamily:"'Rajdhani',sans-serif"}}>● MODO OFFLINE</div>}
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  <div style={{display:"flex",flexDirection:"column",gap:6}}>
                    <button onClick={()=>setShowShop(true)} style={{padding:"8px 14px",background:"linear-gradient(135deg,#1a4a1a,#0d2e0d)",border:"1px solid rgba(46,204,113,.3)",borderRadius:10,color:"#2ecc71",fontWeight:700,fontSize:11,cursor:"pointer",fontFamily:"'Rajdhani',sans-serif",letterSpacing:1}}>+ COMPRAR</button>
                    <button onClick={()=>setShowAdModal(true)} style={{padding:"8px 14px",background:"linear-gradient(135deg,#2a1800,#1a1000)",border:"1px solid rgba(212,172,13,.35)",borderRadius:10,color:"#d4ac0d",fontWeight:700,fontSize:10,cursor:"pointer",fontFamily:"'Rajdhani',sans-serif",letterSpacing:1,textAlign:"center",lineHeight:1.4}}>
                      📺 +1 FICHA<br/><span style={{fontSize:8,opacity:.6}}>ANÚNCIO GRÁTIS</span>
                    </button>
                  </div>
                </div>
              </div>
              {displayChips<=5&&(
                <button onClick={()=>setShowAdModal(true)} style={{all:"unset",display:"block",width:"100%",boxSizing:"border-box",marginTop:10,padding:"10px 14px",background:"linear-gradient(135deg,rgba(212,172,13,.12),rgba(212,172,13,.06))",border:"1px solid rgba(212,172,13,.4)",borderRadius:10,cursor:"pointer",textAlign:"center"}}>
                  <div style={{color:"#d4ac0d",fontSize:12,fontWeight:900,fontFamily:"'Rajdhani',sans-serif",letterSpacing:1}}>⚠️ FICHAS ACABANDO!</div>
                  <div style={{color:"rgba(255,255,255,.35)",fontSize:10,marginTop:2}}>Toque aqui → assista um anúncio → ganhe +1 ficha</div>
                </button>
              )}
            </div>

            {/* Modo Online/Offline */}
            <div style={{display:"flex",gap:6,marginBottom:16,background:"rgba(255,255,255,.02)",borderRadius:14,padding:4,border:"1px solid rgba(255,255,255,.05)"}}>
              {['offline','online'].map(m=>(
                <button key={m} onClick={()=>setGameMode(m)} style={{flex:1,padding:"9px",background:gameMode===m?m==='online'?"linear-gradient(135deg,rgba(46,204,113,.15),rgba(46,204,113,.05))":"linear-gradient(135deg,rgba(241,196,15,.12),rgba(241,196,15,.04))":"transparent",border:`1px solid ${gameMode===m?m==='online'?"rgba(46,204,113,.4)":"rgba(241,196,15,.3)":"transparent"}`,borderRadius:10,color:gameMode===m?m==='online'?"#2ecc71":"#f1c40f":"#444",cursor:"pointer",fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:12,letterSpacing:2,transition:"all .25s"}}>
                  {m==='offline'?"🎮 OFFLINE":"⚡ ONLINE"}
                </button>
              ))}
              <div style={{textAlign:"center",marginTop:6,color:"rgba(255,255,255,.2)",fontSize:9,fontFamily:"'Rajdhani',sans-serif",letterSpacing:1}}>
                ✓ Mesmo saldo nos dois modos
              </div>
            </div>

            {/* Título jogos */}
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
              <div style={{flex:1,height:1,background:"linear-gradient(90deg,transparent,rgba(241,196,15,.2))"}}/>
              <span style={{color:"rgba(241,196,15,.4)",fontSize:9,letterSpacing:4,fontFamily:"'Rajdhani',sans-serif",fontWeight:700}}>JOGOS</span>
              <div style={{flex:1,height:1,background:"linear-gradient(90deg,rgba(241,196,15,.2),transparent)"}}/>
            </div>

            {/* Grid de jogos */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
              {[
                {k:"pife",i:"🃏",n:"Pife",d:"1 ou 2 baralhos",c:"#2471a3",gc:"#060f1a"},
                {k:"domino",i:"🁣",n:"Dominó",d:"2 a 4 jogadores",c:"#d4ac0d",gc:"#1a1400"},
                {k:"dama",i:"♟",n:"Dama",d:"vs IA • Estratégia",c:"#ca6f1e",gc:"#1a0e05"},
                {k:"xadrez",i:"♔",n:"Xadrez",d:"vs IA • Clássico",c:"#8e44ad",gc:"#12071a"},
                {k:"lobby",i:"🌐",n:"Online",d:"vs Jogadores Reais",c:"#2ecc71",gc:"#082a15"},
                {k:"poker",i:"♠",n:"Poker",d:"Texas Hold'em vs IA",c:"#c0392b",gc:"#2a0808"},
                {k:"go",i:"⚫",n:"Go",d:"19x19 — Clássico oriental",c:"#8B6914",gc:"#1a1205"},
              ].map(g=>(
                <div key={g.k} onClick={()=>!g.disabled&&setScreen(g.k)}
                  style={{background:`linear-gradient(145deg,${g.gc} 0%,#050505 100%)`,border:`1px solid ${g.disabled?"rgba(255,255,255,.05)":`${g.c}25`}`,borderRadius:16,padding:"16px 14px",cursor:g.disabled?"not-allowed":"pointer",opacity:g.disabled?.4:1,transition:"all .25s",position:"relative",overflow:"hidden"}}
                  onMouseEnter={e=>{if(!g.disabled){e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.borderColor=`${g.c}55`;e.currentTarget.style.boxShadow=`0 8px 24px ${g.c}15`;}}}
                  onMouseLeave={e=>{e.currentTarget.style.transform="none";e.currentTarget.style.borderColor=g.disabled?"rgba(255,255,255,.05)":`${g.c}25`;e.currentTarget.style.boxShadow="none";}}>
                  {!g.disabled&&<div style={{position:"absolute",top:0,right:0,width:60,height:60,background:`radial-gradient(circle at top right,${g.c}12,transparent 70%)`}}/>}
                  <div style={{fontSize:28,marginBottom:8}}>{g.i}</div>
                  <div style={{fontWeight:700,fontSize:14,color:"#fff"}}>{g.n}</div>
                  <div style={{color:"#666",fontSize:11,marginTop:2}}>{g.d}</div>
                </div>
              ))}
            </div>

            {/* Sobre / Créditos */}
            <div onClick={()=>setShowAbout(true)} style={{background:"rgba(255,255,255,.02)",border:"1px solid rgba(255,255,255,.05)",borderRadius:12,padding:"12px 16px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}
              onMouseEnter={e=>e.currentTarget.style.background="rgba(255,255,255,.05)"}
              onMouseLeave={e=>e.currentTarget.style.background="rgba(255,255,255,.02)"}>
              <div>
                <div style={{color:"#aaa",fontSize:13,fontWeight:700}}>ℹ️ Sobre & Créditos</div>
                <div style={{color:"#555",fontSize:10}}>ar.softworks.suport@gmail.com</div>
              </div>
              <div style={{color:"#555"}}>›</div>
            </div>

            <div style={{textAlign:"center",color:"#2a2a2a",fontSize:9,marginTop:8}}>
              Dev: AR Softworks™ & AR Softworks™ • 🔞 +18
            </div>
          </div>
        )}
        {GAMES[screen]}
      </div>

      {/* Bottom Nav */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,zIndex:200,background:"rgba(4,4,4,.98)",backdropFilter:"blur(20px)",borderTop:"1px solid rgba(241,196,15,.18)",display:"flex",minHeight:60,paddingBottom:"env(safe-area-inset-bottom)"}}>
        {nav.map(item=>(
          <button key={item.k} onClick={()=>{if(item.k==='shop_btn'){setShowShop(true);return;}if(item.k==='lobby')setGameMode('online');setScreen(item.k);}} style={{flex:1,minWidth:44,background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:2,color:screen===item.k?"#f1c40f":"#3a3a3a",borderTop:screen===item.k?"2px solid #f1c40f":"2px solid transparent",transition:"all .2s",fontSize:8,fontWeight:700,padding:"8px 0"}}>
            <span style={{fontSize:16}}>{item.i}</span>{item.l}
          </button>
        ))}
      </div>

      {/* Modais */}
      {showShop&&<ShopScreen user={authUser} userData={userData} token={token} chips={chips} onClose={()=>setShowShop(false)}/>}
      {showAdModal&&(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.92)",zIndex:9999,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#111",border:"2px solid #f1c40f",borderRadius:16,padding:28,maxWidth:340,width:"100%",textAlign:"center"}}>
        {!adWatching?<>
          <div style={{fontSize:44,marginBottom:8}}>📺</div>
          <div style={{color:"#f1c40f",fontSize:18,fontWeight:900,fontFamily:"'Cinzel',Georgia,serif",marginBottom:4,letterSpacing:1}}>GANHE 1 FICHA</div>
          <div style={{color:"rgba(255,255,255,.4)",fontSize:11,marginBottom:14,fontFamily:"'Rajdhani',sans-serif"}}>grátis assistindo um anúncio</div>
          <div style={{background:"rgba(46,204,113,.08)",border:"1px solid rgba(46,204,113,.2)",borderRadius:12,padding:"12px",marginBottom:14}}>
            <div style={{color:"#2ecc71",fontSize:30,fontWeight:900,fontFamily:"'Cinzel',Georgia,serif"}}>+10 🎰</div>
            <div style={{color:"rgba(255,255,255,.35)",fontSize:10,marginTop:2,fontFamily:"'Rajdhani',sans-serif",letterSpacing:1}}>CREDITADO AUTOMATICAMENTE</div>
          </div>
          <div style={{color:"rgba(255,255,255,.3)",fontSize:11,marginBottom:14,lineHeight:1.6,textAlign:"left",background:"rgba(255,255,255,.03)",borderRadius:8,padding:"10px 12px"}}>
            1️⃣ Clique no botão abaixo<br/>
            2️⃣ Assista o anúncio até o final<br/>
            3️⃣ Receba <strong style={{color:"#2ecc71"}}>+10 fichas</strong> automaticamente!
          </div>
          <button onClick={watchAd} style={{width:"100%",padding:"16px",background:"linear-gradient(135deg,#d4ac0d,#a07d08)",border:"none",borderRadius:12,color:"#000",fontSize:15,fontWeight:900,cursor:"pointer",fontFamily:"'Cinzel',Georgia,serif",marginBottom:10,boxShadow:"0 4px 20px rgba(212,172,13,.4)",letterSpacing:1}}>
            📺 ASSISTIR E GANHAR +10 FICHAS
          </button>
          <button onClick={()=>setShowAdModal(false)} style={{width:"100%",padding:"10px",background:"transparent",border:"1px solid rgba(255,255,255,.08)",borderRadius:10,color:"#444",fontSize:12,cursor:"pointer",fontFamily:"'Rajdhani',sans-serif",letterSpacing:1}}>
            AGORA NÃO
          </button>
        </>:<>
          <div style={{fontSize:48,marginBottom:12}}>📺</div>
          <div style={{color:"#f1c40f",fontSize:16,fontWeight:700,marginBottom:16}}>Assistindo anúncio...</div>
          <div style={{width:80,height:80,borderRadius:"50%",background:"rgba(241,196,15,.1)",border:"4px solid #f1c40f",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 16px",fontSize:28,fontWeight:900,color:"#f1c40f"}}>
            {adTimer}
          </div>
          <div style={{color:"#555",fontSize:12}}>Não feche esta tela!</div>
          <div style={{height:4,background:"rgba(255,255,255,.05)",borderRadius:2,marginTop:16,overflow:"hidden"}}>
            <div style={{height:"100%",background:"#f1c40f",borderRadius:2,width:`${((30-adTimer)/30)*100}%`,transition:"width 1s linear"}}/>
          </div>
        </>}
      </div>
    </div>
  )}
  {showProfile&&<ProfileScreen user={authUser} userData={userData} onSave={d=>setUserData(u=>({...u,...d}))} onClose={()=>setShowProfile(false)}/>}
      {showAbout&&<AboutScreen onClose={()=>setShowAbout(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});
}
</script>
</body>
</html>
